<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Saúde</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <script>
        function mostrarCampo(id, mostrar) {
            document.getElementById(id).style.display = mostrar ? 'block' : 'none';
        }
    </script>
</head>
<body>
    <div class="container">
        <h2>Saúde</h2>
        <form action="../controllers/boas_vindas.php" method="POST">

            <!-- NOVO CAMPO ADICIONADO: TIPO SANGUÍNEO -->
            <label>Tipo sanguíneo:</label>
            <select name="tipo_sanguineo" required>
                <option value="">Selecione</option>
                <option>O+</option>
                <option>O-</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
            </select>
            <!-- FIM DO CAMPO NOVO -->

            <label>Pratica atividade física?</label>
            <select name="atividade_fisica">
                <option>Não</option>
                <option>Sim</option>
            </select>

            <label>Possui hábitos nocivos?</label>
            <select name="habitos_nocivos">
                <option>Não</option>
                <option>Sim</option>
            </select>

            <label>Possui diabetes?</label>
            <select name="diabetes">
                <option>Não</option>
                <option>Sim</option>
            </select>

            <label>Possui alguma doença crônica?</label>
            <select name="doenca_cronica" onchange="mostrarCampo('campoDoenca', this.value==='Sim')">
                <option>Não</option>
                <option>Sim</option>
            </select>
            <div id="campoDoenca" class="hidden">
                <label>Quais?</label>
                <input type="text" name="quais_doencas">
            </div>

            <label>Possui alergias?</label>
            <select name="alergias" onchange="mostrarCampo('campoAlergia', this.value==='Sim')">
                <option>Não</option>
                <option>Sim</option>
            </select>
            <div id="campoAlergia" class="hidden">
                <label>Quais?</label>
                <input type="text" name="quais_alergias">
            </div>

            <button type="submit">Finalizar cadastro</button>
        </form>
    </div>
</body>
</html>
